<!--
  Webinar replay · section 3 of 3 (Custom Code): testimonials and one button to the sales page.
  Fill OFFER_URL in the script with the sales page URL.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
.fsr{
  --navy:#274472;--navy-d:#1a2d50;--navy-x:#142340;
  --gold:#AB9461;--gold-d:#8a7340;--gold-l:#F2E4A6;--gold-xl:#f8f0d4;
  --slate:#5d6a82;--bg:#FAF9F6;--cream:#f4efe5;--sand:#EDE7DB;--rose:#f4e9e4;--rose-d:#9a4b3d;
  --ink:#1f2a3d;--white:#fff;
  --r-sm:12px;--r:20px;--r-lg:28px;--arch:999px 999px var(--r-lg) var(--r-lg);
  --sh:0 24px 60px -24px rgba(26,45,80,.28);--sh-sm:0 10px 30px -14px rgba(26,45,80,.22);
  --s-sec:clamp(72px,10vw,140px);
  --ease:cubic-bezier(.2,.7,.2,1);
  font-family:'Inter',system-ui,sans-serif;font-size:17px;line-height:1.7;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.fsr *,.fsr *::before,.fsr *::after{box-sizing:border-box}
.fsr img{max-width:100%;height:auto;display:block}
.fsr h1,.fsr h2,.fsr h3{font-family:'Cormorant Garamond',Georgia,serif;color:var(--navy);line-height:1.08;margin:0 0 .45em;font-weight:600;font-variant-numeric:lining-nums;letter-spacing:-.01em}
.fsr h1{font-size:clamp(2.6rem,6.2vw,4.6rem)}
.fsr h2{font-size:clamp(2.1rem,4.8vw,3.4rem)}
.fsr h3{font-size:1.5rem}
.fsr h1 em,.fsr h2 em{font-style:italic;color:var(--gold-d);font-weight:500}
.fsr p{margin:0 0 1em}
.fsr a{color:inherit}
.fsr .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.fsr .narrow{max-width:740px;margin-left:auto;margin-right:auto}
.fsr section{padding:var(--s-sec) 0;position:relative}
.fsr .center{text-align:center}
.fsr .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:.76rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);margin-bottom:18px}
.fsr .eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.fsr .center .eyebrow::after{content:"";width:28px;height:1px;background:currentColor}
.fsr .lead{font-size:clamp(1.1rem,1.6vw,1.28rem);color:var(--slate);line-height:1.6}
.fsr .serif-q{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.3;color:var(--navy)}
.fsr .cream{background:var(--cream)}
.fsr .white{background:var(--white)}
.fsr .dark{background:var(--navy-x);color:#dfe5f0}
.fsr .dark h2,.fsr .dark h3{color:#fff}
.fsr .dark .eyebrow{color:var(--gold-l)}
.fsr .dark .lead{color:#c3cde0}

/* Buttons */
.fsr .btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:16px 34px;border-radius:999px;background:var(--gold);color:#fff;font-weight:600;font-size:1.03rem;text-decoration:none;border:0;cursor:pointer;transition:background .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);box-shadow:0 14px 30px -12px rgba(138,115,64,.7)}
.fsr .btn svg{width:18px;height:18px;transition:transform .25s var(--ease)}
.fsr .btn:hover{background:var(--gold-d);transform:translateY(-2px)}
.fsr .btn:hover svg{transform:translateX(4px)}
.fsr .btn:active{transform:translateY(0)}
.fsr .btn-ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.fsr .btn-ghost:hover{background:var(--navy);color:#fff}
.fsr a:focus-visible,.fsr button:focus-visible,.fsr summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.fsr .cta-row{margin-top:36px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.fsr .center .cta-row{justify-content:center}
.fsr .micro{font-size:.86rem;color:var(--slate);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fsr .micro svg{width:16px;height:16px;color:var(--gold)}

/* Icons */
.fsr .ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Arch photo signature */
.fsr .arch{border-radius:var(--arch);overflow:hidden;position:relative;box-shadow:var(--sh);background:var(--sand)}
.fsr .arch img{width:100%;height:100%;object-fit:cover}
.fsr .photo{border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh);background:var(--sand)}
.fsr .photo img{width:100%;height:100%;object-fit:cover}

/* Sticky bar */
.fsr .bar{position:sticky;top:0;z-index:60;background:var(--navy-x);color:#fff;font-size:.9rem}
.fsr .bar .wrap{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.fsr .bar .t{display:flex;gap:6px;font-variant-numeric:tabular-nums}
.fsr .bar .t span{background:rgba(255,255,255,.1);border-radius:6px;padding:2px 8px;font-weight:600;color:var(--gold-l)}
.fsr .bar a{background:var(--gold);color:#fff;text-decoration:none;font-weight:600;padding:8px 20px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center}

/* Hero */
.fsr .hero{padding:clamp(48px,7vw,96px) 0 clamp(72px,9vw,120px);background:radial-gradient(1200px 600px at 85% 10%,var(--gold-xl),transparent 60%),linear-gradient(180deg,var(--bg),var(--cream))}
.fsr .hero-grid{display:grid;gap:56px;align-items:center;grid-template-columns:1fr}
@media(min-width:940px){.fsr .hero-grid{grid-template-columns:1.12fr .88fr}}
.fsr .hero .arch{aspect-ratio:4/5;max-width:460px;margin:0 auto;width:100%}
.fsr .hero-photo{position:relative}
.fsr .hero-photo::before{content:"";position:absolute;inset:-18px -18px 40px 40px;border:1.5px solid var(--gold);border-radius:var(--arch);opacity:.5}
.fsr .float{position:absolute;background:#fff;border-radius:var(--r);padding:14px 18px;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--navy);font-weight:500;line-height:1.3}
.fsr .float b{display:block;font:700 1.5rem 'Cormorant Garamond',serif;color:var(--navy);font-variant-numeric:lining-nums}
.fsr .float .dot{width:42px;height:42px;border-radius:50%;background:var(--gold-xl);display:flex;align-items:center;justify-content:center;color:var(--gold-d);flex:none}
.fsr .float-1{left:-10px;bottom:70px}
.fsr .float-2{right:-6px;top:40px}
@media(max-width:560px){.fsr .float-1{left:4px}.fsr .float-2{right:4px}}
.fsr .chips{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 0;padding:0;list-style:none}
.fsr .chips li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border:1px solid var(--sand);border-radius:999px;padding:8px 16px;font-size:.88rem;color:var(--navy)}
.fsr .chips .ico{width:18px;height:18px;color:var(--gold-d)}

/* Pain */
.fsr .pain-grid{display:grid;gap:48px;grid-template-columns:1fr;align-items:start}
@media(min-width:940px){.fsr .pain-grid{grid-template-columns:.9fr 1.1fr}}
.fsr .signs{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.fsr .signs li{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--sand);border-radius:var(--r-sm);padding:16px 18px;color:var(--ink)}
.fsr .signs li::before{content:"";flex:none;width:10px;height:10px;margin-top:9px;border-radius:50%;background:var(--gold)}
.fsr .or{display:flex;align-items:center;gap:18px;margin:34px 0}
.fsr .or::before,.fsr .or::after{content:"";flex:1;height:1px;background:var(--sand)}
.fsr .or span{font:italic 600 2rem 'Cormorant Garamond',serif;color:var(--gold-d)}

/* Mirror intro */
.fsr .split{display:grid;gap:56px;grid-template-columns:1fr;align-items:center}
@media(min-width:940px){.fsr .split{grid-template-columns:1fr 1fr}.fsr .split.rev>:first-child{order:2}}
.fsr .split .photo{aspect-ratio:4/3}
.fsr .trio{display:grid;gap:14px;margin-top:28px}
.fsr .trio div{display:flex;gap:16px;align-items:flex-start}
.fsr .trio .n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center}
.fsr .trio .n .ico{width:20px;height:20px}
.fsr .trio b{display:block;color:var(--navy);font-size:1.05rem}
.fsr .trio span{color:var(--slate)}
.fsr .welcome{margin-top:var(--s-sec);background:var(--navy);color:#e6ebf4;border-radius:var(--r-lg);padding:clamp(32px,6vw,72px);text-align:center;position:relative;overflow:hidden}
.fsr .welcome::after{content:"";position:absolute;width:520px;height:520px;right:-180px;top:-220px;border-radius:50%;border:1px solid rgba(242,228,166,.25);box-shadow:0 0 0 60px rgba(242,228,166,.04),0 0 0 120px rgba(242,228,166,.03)}
.fsr .welcome h2{color:#fff}
.fsr .welcome h2 em{color:var(--gold-l)}
.fsr .welcome p{color:#c9d2e3;max-width:640px;margin-left:auto;margin-right:auto}

/* ===== Enneagram explorer ===== */
.fsr .explorer{display:grid;gap:40px;grid-template-columns:1fr;align-items:center;margin-top:48px}
@media(min-width:980px){.fsr .explorer{grid-template-columns:1fr 1fr;gap:64px}}
.fsr .hint{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:#fff;font-size:.9rem;font-weight:500;padding:10px 18px;border-radius:999px;box-shadow:var(--sh-sm);margin-bottom:22px}
.fsr .hint svg{width:20px;height:20px;color:var(--gold-l)}
.fsr.js .hint svg{animation:fsr-tap 1.6s var(--ease) infinite}
@keyframes fsr-tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.fsr .dial-wrap{text-align:center}
.fsr .dial{position:relative;width:100%;max-width:500px;margin:0 auto;aspect-ratio:1}
.fsr .dial svg.lines{position:absolute;inset:0;width:100%;height:100%}
.fsr .dial .line{transition:stroke .3s,stroke-width .3s,opacity .3s}
.fsr .dial .line.on{stroke:var(--c,var(--gold));stroke-width:3;opacity:1}
.fsr .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;pointer-events:none}
.fsr .hub b{font:700 clamp(2.4rem,7vw,3.6rem) 'Cormorant Garamond',serif;line-height:1;color:var(--c,var(--navy));font-variant-numeric:lining-nums;transition:color .3s}
.fsr .hub span{font-size:clamp(.72rem,1.6vw,.88rem);font-weight:600;color:var(--navy);margin-top:4px}
.fsr .hub small{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-top:2px}
.fsr .pt{position:absolute;transform:translate(-50%,-50%);width:clamp(48px,11vw,62px);height:clamp(48px,11vw,62px);border-radius:50%;border:2px solid var(--c);background:#fff;color:var(--c);font:700 clamp(1.2rem,3vw,1.5rem) 'Cormorant Garamond',serif;font-variant-numeric:lining-nums;cursor:pointer;transition:background .25s,color .25s,transform .25s var(--ease),box-shadow .25s;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);padding:0}
.fsr .pt::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);opacity:0}
.fsr.js .dial:not(.touched) .pt::after{animation:fsr-pulse 2.4s ease-out infinite}
.fsr.js .dial:not(.touched) .pt:nth-of-type(odd)::after{animation-delay:1.2s}
@keyframes fsr-pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.6);opacity:0}}
.fsr .pt:hover{transform:translate(-50%,-50%) scale(1.12)}
.fsr .pt[aria-selected="true"]{background:var(--c);color:#fff;transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 18%,transparent),var(--sh-sm)}
.fsr .pt .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--navy-x);color:#fff;font:500 .78rem 'Inter',sans-serif;white-space:nowrap;padding:5px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.fsr .pt:hover .tip,.fsr .pt:focus-visible .tip{opacity:1}
.fsr .c-body{--c:#274472}.fsr .c-heart{--c:#9a7a3a}.fsr .c-head{--c:#5f7d8c}
.fsr .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;margin:26px 0 0;padding:0;list-style:none;font-size:.86rem;color:var(--slate)}
.fsr .legend li{display:flex;align-items:center;gap:8px}
.fsr .legend i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.fsr .tabs{display:none}
.fsr.js .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.fsr .tab{border:1px solid var(--sand);background:#fff;border-radius:12px;padding:10px 8px;font:500 .85rem 'Inter',sans-serif;color:var(--navy);cursor:pointer;min-height:44px;transition:background .2s,border-color .2s,color .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.fsr .tab b{color:var(--c);font-variant-numeric:lining-nums}
.fsr .tab:hover{border-color:var(--c)}
.fsr .tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.fsr .tab[aria-selected="true"] b{color:#fff}
@media(max-width:520px){.fsr .tab span{display:none}}
.fsr .panel{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden;border-top:6px solid var(--c);margin-bottom:18px}
.fsr.js .panel[hidden]{display:none}
.fsr.js .panel{animation:fsr-in .45s var(--ease)}
@keyframes fsr-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fsr .panel-h{display:flex;align-items:center;gap:18px;padding:28px 30px 8px}
.fsr .panel-h .big{flex:none;width:72px;height:72px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font:700 2.4rem 'Cormorant Garamond',serif;font-variant-numeric:lining-nums}
.fsr .panel-h small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:600}
.fsr .panel-h h3{margin:2px 0 0;font-size:2rem}
.fsr .panel-b{padding:16px 30px 28px;display:grid;gap:12px}
.fsr .blk{border-radius:16px;padding:18px 20px;display:flex;gap:14px}
.fsr .blk .ico{width:26px;height:26px;margin-top:2px}
.fsr .blk b{display:block;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.fsr .blk p{margin:0;color:var(--ink)}
.fsr .blk.stress{background:var(--rose)}.fsr .blk.stress .ico,.fsr .blk.stress b{color:var(--rose-d)}
.fsr .blk.calm{background:var(--gold-xl)}.fsr .blk.calm .ico,.fsr .blk.calm b{color:var(--gold-d)}
.fsr .panel-f{display:none}
.fsr.js .panel-f{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--sand);padding:14px 20px}
.fsr .navb{background:none;border:0;cursor:pointer;font:600 .9rem 'Inter',sans-serif;color:var(--navy);display:inline-flex;align-items:center;gap:8px;padding:10px 12px;min-height:44px;border-radius:10px}
.fsr .navb:hover{background:var(--cream)}
.fsr .navb svg{width:18px;height:18px}
.fsr .count{font-size:.85rem;color:var(--slate);font-variant-numeric:tabular-nums}
.fsr .note{display:flex;gap:14px;align-items:flex-start;background:var(--navy);color:#e6ebf4;border-radius:var(--r);padding:20px 22px}
.fsr .note .ico{color:var(--gold-l);width:24px;height:24px;margin-top:2px}
.fsr .note p{margin:0}
.fsr .after-dial{margin-top:56px;background:var(--cream);border-radius:var(--r-lg);padding:clamp(28px,5vw,48px);display:grid;gap:24px;grid-template-columns:1fr;align-items:center}
@media(min-width:840px){.fsr .after-dial{grid-template-columns:1fr auto}}
.fsr .after-dial p{margin:0;font-size:1.1rem;color:var(--navy)}

/* Timeline */
.fsr .tl-grid{display:grid;gap:56px;grid-template-columns:1fr}
@media(min-width:980px){.fsr .tl-grid{grid-template-columns:.85fr 1.15fr}.fsr .tl-side{position:sticky;top:90px;align-self:start}}
.fsr .tl-side .arch{aspect-ratio:3/4;max-width:420px}
.fsr .phases{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.fsr .phase{background:#fff;border:1px solid var(--sand);border-radius:var(--r);padding:22px 24px;display:grid;grid-template-columns:auto 1fr;gap:6px 20px;transition:box-shadow .25s,transform .25s var(--ease)}
.fsr .phase:hover{box-shadow:var(--sh-sm);transform:translateY(-2px)}
.fsr .phase .wk{grid-row:span 2;width:64px;height:64px;border-radius:18px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--navy)}
.fsr .phase .wk small{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-bottom:4px}
.fsr .phase .wk b{font:700 1.45rem 'Cormorant Garamond',serif;font-variant-numeric:lining-nums}
.fsr .phase h3{font-size:1.35rem;margin:4px 0 0}
.fsr .phase p{margin:0;color:var(--slate);font-size:.97rem}
.fsr .phase.you{background:var(--navy);border-color:var(--navy)}
.fsr .phase.you h3{color:#fff}.fsr .phase.you p{color:#c9d2e3}
.fsr .phase.you .wk{background:var(--gold)}.fsr .phase.you .wk b{color:#fff}.fsr .phase.you .wk small{color:#fff}
.fsr .tag{display:inline-block;font:600 .68rem 'Inter',sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--gold-l);color:var(--navy-d);padding:4px 10px;border-radius:999px;margin-left:10px;vertical-align:middle}

/* Support */
.fsr .pillars{display:grid;gap:16px;grid-template-columns:1fr;margin-top:32px}
@media(min-width:640px){.fsr .pillars{grid-template-columns:1fr 1fr}}
.fsr .pillar{background:#fff;border-radius:var(--r);padding:24px;border:1px solid var(--sand)}
.fsr .pillar .ico{width:40px;height:40px;padding:9px;border-radius:12px;background:var(--gold-xl);color:var(--gold-d);margin-bottom:14px}
.fsr .pillar h3{font-size:1.3rem;margin-bottom:.3em}
.fsr .pillar p{margin:0;color:var(--slate);font-size:.96rem}
.fsr .support .photo{aspect-ratio:4/5}
.fsr .meet{display:inline-flex;align-items:center;gap:12px;margin-top:22px;background:var(--navy);color:#fff;border-radius:999px;padding:10px 22px 10px 10px;font-weight:600}
.fsr .meet img{width:40px;height:40px;border-radius:50%;object-fit:cover}

/* Ennea */
.fsr .ennea-sec{overflow:hidden}
.fsr .ennea-sec::before{content:"";position:absolute;width:700px;height:700px;left:-260px;bottom:-360px;border-radius:50%;background:radial-gradient(circle,rgba(171,148,97,.22),transparent 65%)}
.fsr .phone{position:relative;width:min(340px,100%);margin:0 auto;background:#0d1730;border-radius:44px;padding:14px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.08)}
.fsr .screen{background:var(--bg);border-radius:32px;overflow:hidden;min-height:520px;display:flex;flex-direction:column}
.fsr .scr-h{display:flex;align-items:center;gap:10px;padding:22px 18px 14px;background:#fff;border-bottom:1px solid var(--sand)}
.fsr .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font:700 1.1rem 'Cormorant Garamond',serif}
.fsr .scr-h b{display:block;color:var(--navy);font-size:.95rem;line-height:1.2}
.fsr .scr-h small{color:#3c9a6b;font-size:.75rem}
.fsr .msgs{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.fsr .msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:.88rem;line-height:1.45}
.fsr .msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
.fsr .msg.bot{align-self:flex-start;background:#fff;color:var(--ink);border:1px solid var(--sand);border-bottom-left-radius:6px}
.fsr .time{align-self:center;font-size:.7rem;color:var(--slate);margin-bottom:4px}
.fsr .illu{text-align:center;font-size:.75rem;color:#9fb0cc;margin-top:14px}
